[package]
name = "indicatrix-vault"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
authors = { workspace = true }
description = "SQLite-backed storage, data models, and local import/export for gemstone faceting design libraries."
license = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
documentation = "https://docs.rs/indicatrix-vault"
keywords = ["gemstone", "faceting", "sqlite", "catalog", "database"]
categories = ["database", "database-implementations"]
publish = { workspace = true }

[dependencies]
anyhow = { workspace = true }
# Local library only: reads/writes the user's own `.asc` files (see `crate::local`).
# Keeping this crate's dependency surface to exactly these five is deliberate -- it is
# the storage layer, and nothing in it should ever reach outside the process.
indicatrix-formats = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }

[features]
default = []
# Rough colour and colour zoning from rig photos (plan 2026-10-09, section 1a): the side
# tables `rough_colour`, `rough_colour_photo`, `stone_pose_choice`, `material_zoning` and
# `render_job_zoning`, created (idempotently) only by a build with this feature, and the
# `Database` methods that read and write them. Off by default: a build without it never
# creates, reads, writes or deletes those tables and is unchanged. No dependency is added;
# every payload is opaque text or bytes (the application owns the formats).
zoning = []

[dev-dependencies]
# Tests only: the typed color-recipe round trip (`db::sqlite::tests::materials`) stores a real
# `ColorRecipe`; the storage layer itself still treats `color_recipe_json` as opaque text.
indicatrix = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
