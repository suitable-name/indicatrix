[package]
name = "indicatrix-formats"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
authors = { workspace = true }
description = "Readers and writers for gemstone faceting design file formats."
license = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
documentation = "https://docs.rs/indicatrix-formats"
keywords = ["gemstone", "faceting", "gemcad", "parser", "cad"]
categories = ["parser-implementations", "encoding"]
publish = { workspace = true }

[dependencies]
# `native.rs`'s on-disk encoding: `serde` for the schema types, `toml` for the text
# format itself, `sha2` for the paired-`.asc` fingerprint. See `native/mod.rs`'s own
# module doc comment for why TOML (not `serde_json`) and SHA-256 (not a cheaper
# non-cryptographic hash) are the right choices. `asc` (this crate's other format
# module) still has none of these -- see this file's own crate doc comment on why
# each format module only pulls in what it needs.
serde = { workspace = true }
sha2 = { workspace = true }
toml = { workspace = true }

[lints]
workspace = true
