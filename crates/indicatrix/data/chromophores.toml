    # Emerald: weak R-line emission (683/680 nm) with a small sideband. Phi_0 = 0.3 is an ESTIMATE
    # (emerald Cr3+ is a less efficient emitter than ruby); iron quenches it much sooner than in
    # ruby (Report p.21: intense only in Fe-poor emerald; p.31: gone by 0.5-1.0 wt% FeO). The
    # halving concentration is ~660 ppm Fe = 0.0849 wt% FeO (research-2026-10-primary-data §8, a
    # DERIVED estimate: the GIA Fall 2017 PL study, read at abstract level, gives a tenfold fall at
    # 2200 ppm Fe, probably ppmw, so a pure exponential halves at 2200 x log10(2) = 660 ppm; the
    # exponential is approximated by the n = 2 law, which also gives a 12-fold fall at 2200 ppm).
    [[host.chromophore.fluorescence]]
    emission_nm = [683.0, 680.0]
    emission_fwhm_nm = 1.0
    emission_weight = [0.6, 0.4]
    sideband = { centre_nm = 700.0, fwhm_nm = 25.0, weight = 0.3 }
    quantum_yield = 0.3
    quench = [{ by = "Fe", unit = "wt_pct_oxide:FeO", c_half = 0.0849, n = 2.0 }]
    uv = { lw = "red (R-lines), quenched by Fe", sw = "red (R-lines), quenched by Fe" }
    confidence = "estimate"
    source = "Report p.21-22, p.31 (emerald R lines, Fe quenching); research-2026-10-primary-data §8 (GIA G&G Fall 2017 abstract: tenfold PL fall at 2200 ppm Fe, c_half derived = 660 ppm Fe, estimate); yield, sideband and the quench law are estimates"

