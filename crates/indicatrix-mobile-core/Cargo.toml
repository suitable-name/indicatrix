[package]
name = "indicatrix-mobile-core"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
authors = { workspace = true }
description = "The UI-free core of the Indicatrix mobile app: app state, settings and paths, the compute threads (render pool, solve, analysis), file bytes in and out, cutting progress and the platform-service trait every mobile front end implements. No Slint, no JNI, no Objective-C: it is shared by the Android app and any later iOS app, and tested natively."
license = { workspace = true }
repository = { workspace = true }
publish = { workspace = true }

[dependencies]
indicatrix-net = { workspace = true, features = ["render"] }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
zeroize = "1.9.1"
# The CPU spectral tracer, materials, lighting presets and the `.hdr` decoder.
# Zoning (the color-zoned built-ins such as Ametrine, and their CPU zone kernel) is always
# on in `indicatrix` (owner decision M-D10).
indicatrix = { workspace = true, features = ["hdr", "serde"] }
# `Design`, `History`, the native codec, templates, optimize.
indicatrix-cut-core = { workspace = true }
# `EditorSession`, view models, cutting mode, cut sheet, guide, file classification.
indicatrix-editor = { workspace = true }
indicatrix-formats = { workspace = true }
# The local library (SQLite, bundled through the NDK clang on Android).
indicatrix-vault = { workspace = true }
# Solid view and diagram rasters (RGBA8).
indicatrix-solid = { workspace = true }
# The DOM-free compute side of the web app: scene spec -> `OwnedScene`, chunk
# planner, accumulator, abortable chunk tracing, the solve worker, display/PNG.
indicatrix-web-core = { workspace = true }
glam = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
# The progress-file key of a design without an id (`cutting::key`).
sha2 = { workspace = true }
tracing = { workspace = true }

[features]
default = []
device-gpu = ["indicatrix/gpu"]

[lints]
workspace = true
