[package]
name = "indicatrix-web-gpu"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
authors = { workspace = true }
description = "The WebGPU render Worker entry point of the indicatrix browser app: decodes a message, runs event-wavefront GPU rendering, posts the reply. Built by Trunk as a worker next to apps/indicatrix-web."
license = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
documentation = "https://docs.rs/indicatrix-web-gpu"
keywords = ["gemstone", "wasm", "webgpu", "webworker"]
categories = ["wasm"]
publish = { workspace = true }

# `cdylib` for wasm-bindgen/Trunk; `rlib` so a native `cargo check`/`clippy` of the
# workspace type-checks this crate as an ordinary (empty) library, like
# `apps/indicatrix-web`.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.7"
indicatrix = { workspace = true, features = ["gpu", "hdr"] }
indicatrix-web-core = { workspace = true }
futures-channel = { version = "0.3.34", default-features = false, features = ["std"] }
futures-util = { version = "0.3.34", default-features = false, features = ["async-await"] }
glam = { workspace = true }
js-sys = "0.3.106"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.56"
web-sys = { version = "0.3.106", default-features = false, features = [
    "DedicatedWorkerGlobalScope",
    "MessageEvent",
    "Performance",
    "WorkerGlobalScope",
    "console",
] }
wgpu = { workspace = true, features = ["wgsl", "webgpu"] }

[lints]
workspace = true
