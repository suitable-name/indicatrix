[package]
name = "indicatrix-worker"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
authors = { workspace = true }
description = "Coordinator and render worker for an indicatrix-backed design catalogue. `serve` (default build) is the coordinator: it serves indicatrix-net's read-only design-library protocol to viewers over mutual TLS and accepts joining render workers on a separate worker port. The optional `worker` feature adds render capacity -- `join` (dial a coordinator and render its requests), `serve --render` (render with the coordinator's own CPU/GPU) and `render` (a one-shot scene-to-PNG CLI)."
license = { workspace = true }
repository = { workspace = true }
documentation = { workspace = true }
keywords = ["gemstone", "raytracer", "server", "rendering", "spectral"]
categories = ["command-line-utilities", "network-programming", "rendering"]
publish = { workspace = true }

[[bin]]
name = "indicatrix-worker"
path = "src/main.rs"

[dependencies]
# `indicatrix-vault`'s `Database` methods return `anyhow::Result` -- `crate::serve::library`
# matches on those errors directly (to log the real reason server-side while reporting
# a generic message to the peer -- see that module's doc comment).
anyhow = { workspace = true }
bytemuck = { workspace = true, optional = true }
# Always present: the design library this binary serves. Opened read-only when
# possible (`--db`, or the default `facet_diagrams.sqlite` -- see `crate::serve::library`
# and `indicatrix_vault::db::sqlite::Database::open_read_only`).
indicatrix-vault = { workspace = true }
# `indicatrix-net` already depends on `indicatrix` with the `serde` feature on (for
# `SceneState`'s nested types, gated behind `indicatrix-net`'s own `render` feature); this
# crate also names `indicatrix::` directly (`gpu_backend::GpuBackend`, the CPU tracer's
# `optics::raytracer`, `renderer::buffers::MAX_ABSORPTION_BANDS`), so it needs its own
# dependency line too, not merely a re-export.
indicatrix = { workspace = true, features = ["serde"], optional = true }
# Always present: the wire protocol (library-protocol types are always compiled in;
# `indicatrix-net`'s own `render` feature -- which pulls in `indicatrix`-dependent types like
# `SceneState`/`RenderRequest` -- is turned on only by this crate's `worker` feature
# below, never unconditionally).
indicatrix-net = { workspace = true }
# Coordinator job execution (`worker` feature): the lane pool, sample cursor, rate
# models and deterministic merge a coordinator fans a viewer's request out with.
indicatrix-dispatch = { workspace = true, optional = true }
glam = { workspace = true, features = ["bytemuck"], optional = true }
image = { workspace = true, features = ["png"], optional = true }
# Decodes a `ClientMessage` (CANCEL or RenderRequest) raw postcard bytes directly in
# `stream_emit::poll_for_client_message`, which already has the payload as a `Vec<u8>`
# (read with its own timeout-tolerant loop) -- `indicatrix_net::messages::read_message` isn't
# reusable there since it reads from a `Read` itself rather than decoding bytes already
# in hand.
postcard = { workspace = true, optional = true }
# `pki` module (the `cert init`/`issue-server`/`issue-client` subcommands) and mutual
# TLS itself: in-process CA/leaf certificate generation and the TLS wrapping every
# accepted connection goes through, regardless of whether this build has render
# capacity -- the library protocol sits behind the exact same authentication as the
# render protocol (see `serve`'s module docs), so these stay unconditional deps, never
# gated by `worker`.
rcgen = { workspace = true }
# `enroll`/`enroll_client` modules: reused here as the CSPRNG source for a fresh 256-bit
# enrollment secret, rather than adding a new randomness dependency.
ring = "0.17.14"
rustls = { workspace = true }
# Scene-file loading for the `render` subcommand only.
serde_json = { workspace = true, optional = true }
# `enroll`/`enroll_client` modules (token-based cert enrollment -- see `enroll.rs`'s
# module doc comment): reused here (and by `crate::serve::library`'s per-design
# content-hash versioning, see that module's own doc comment) to hash the enrollment
# token's bearer secret before it's ever stored.
sha2 = { workspace = true }
# TCP keepalive + TCP_NODELAY tuning for every accepted connection (`crate::serve::run`'s
# accept loop) -- unconditional (not gated by the `worker` feature): the library-only build
# also serves long-lived streamed responses (a large search result, an attachment fetch) that
# benefit equally from detecting a vanished peer and from not paying Nagle's coalescing delay
# on small, latency-sensitive writes.
socket2 = { workspace = true }
# `enroll`/`enroll_client` modules: constant-time secret comparison (already a direct
# dependency of `rustls`).
subtle = "2.6.1"
time = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# `enroll`/`enroll_client` modules: key-material zeroization on drop (already a direct
# dependency of `rustls`).
zeroize = "1.9"

# Payload codec measurement only (`examples/payload_codec_bench.rs`). The production
# codecs now live in `indicatrix-net` (`radiance::payload`, behind its default-on
# `compression` feature); the bench keeps its own direct dependency because it also
# measures variants production never sends (unshuffled LZ4/zstd, zstd level 3).
[dev-dependencies]
lz4_flex = "0.11"
zstd = "0.13"

# Renders real FRAME payloads with the production render core (needs `worker`; add
# `gpu` to trace on the adapter).
[[example]]
name = "capture_frame_payloads"
required-features = ["worker"]

[features]
default = []
# The render path: `RenderRequest` handling, `stream_emit`, `render_core`, `render_cmd`,
# the `render` subcommand, and `Backend` advertisement in `WELCOME`. Off by default --
# see the crate docs on why serving the design library, not rendering, is this binary's
# default, primary role. Turns on `indicatrix-net`'s own `render` feature too, which is what
# actually gates `indicatrix` out of a default build's dependency tree (see that crate's
# `Cargo.toml`) -- without that half, `indicatrix-net` would still pull `indicatrix` in via its
# own unconditional dependency, and this feature alone wouldn't achieve anything.
# `indicatrix/hdr`: decoding the HDR environment maps a viewer sends by content hash
# (protocol v14 -- `crate::assets`) with the exact decoder the viewer uses.
worker = ["dep:indicatrix", "dep:indicatrix-dispatch", "dep:glam", "dep:bytemuck", "dep:postcard", "dep:serde_json", "dep:image", "indicatrix/hdr", "indicatrix-net/render"]
# GPU with no render capacity is meaningless, so this implies `worker`. Routes tracing
# through indicatrix's verified GPU megakernel (`indicatrix::renderer::gpu::frame::GpuFrameRenderer`,
# wrapped by this crate's own `gpu_backend::GpuBackend`) for both `render` and `serve`,
# falling back to the CPU tracer per batch whenever the GPU declines (no adapter,
# `--only-cpu`, a scene past the adapter's buffer limits, or a lost device -- see
# `gpu_backend`'s own doc comment; every material is GPU-supported). Off by
# default even with `worker` on: `wgpu`/`pollster` is a real dependency tree, and a
# render-capable server may still run on a machine with no GPU adapter at all.
gpu = ["worker", "indicatrix/gpu"]

[lints]
workspace = true

[target.'cfg(windows)'.build-dependencies]
winresource = { workspace = true }
