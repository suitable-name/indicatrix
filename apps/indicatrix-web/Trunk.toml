# Trunk (https://trunkrs.dev) build config for `indicatrix-web`. Run from this directory
# (`apps/indicatrix-web`): `trunk serve` for a dev server with live rebuild, `trunk build
# --release` for a deployable `dist/`. Neither is run by this workspace's own tooling
# -- see `README.md` for why `trunk` is a tool the user installs themselves
# (`cargo install --locked trunk`), never something this repository's build assumes.
[build]
target = "index.html"
dist = "dist"
# Subresource Integrity off. Trunk stamps an `integrity="sha384-..."` attribute onto the
# `<script>`/`<link>` tags it generates, hashing the bytes it wrote to `dist/`; the
# browser rehashes what it actually RECEIVED and refuses to run the file if the two
# differ. That is a guarantee about the transport, not about this build -- so anything
# that rewrites the payload between `dist/` and the browser breaks it, even though the
# code is fine. In practice that means an edge/CDN layer doing JS minification or
# script injection (Cloudflare's Auto Minify and Rocket Loader both do exactly this), or
# a deploy that copies a fresh `.js` while an older `index.html` is still cached.
#
# Observed against the real deployment: `Failed to find a valid digest in the
# 'integrity' attribute for resource '.../indicatrix-web-<hash>.js' ... The resource has
# been blocked.` -- a hard failure with a blank page, not a degraded one.
#
# The cost of turning it off is real but small here: SRI's purpose is to detect a host
# or CDN serving tampered script bytes. This page is served over HTTPS from the user's
# own host and loads no third-party scripts at all (see `index.html` -- Trunk's own
# generated tag is the only one), so TLS already covers the in-transit case this would
# add to. Re-enable by deleting this line if the upstream rewriting is ever identified
# and switched off.
no_sri = true
# The wasm-opt level, the wasm features it may assume and the Cargo profiles are set per
# module on the `<link>`s in `index.html` (page: `s`, Worker: `3`; profiles
# `indicatrix-web-compute` for dev and `indicatrix-web-release` for `--release`). Nothing
# else here overrides Trunk's defaults; the app needs a browser with bulk memory, sign
# extension, reference types and multivalue (Chrome 96, Firefox 100, Safari 15.2 or newer).

[watch]
# The Web Worker (`index.html`'s `data-type="worker"` link) and the compute core it
# and the app share live in sibling crates; watch them too so `trunk serve` rebuilds
# on their edits.
watch = ["src", "ui", "Cargo.toml", "build.rs", "../../crates/indicatrix-web-core/src", "../../crates/indicatrix-web-core/Cargo.toml", "../indicatrix-web-compute/src", "../indicatrix-web-compute/Cargo.toml"]

[serve]
addresses = ["127.0.0.1"]
port = 8080
open = false
