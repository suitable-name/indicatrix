<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>indicatrix-web</title>
    <!--
      No CSS/JS of this page's own beyond this reset: Slint's `renderer-femtovg`
      backend creates its own `<canvas>` and drives everything inside it. `trunk`
      rewrites the `data-trunk` link below into a `<script type="module">` that loads
      the built `.wasm`/`.js` pair and runs `indicatrix-web`'s `#[wasm_bindgen(start)]`
      entry point automatically -- no inline script of this crate's own is needed to
      kick it off.
    -->
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #1b1b1f;
      }
      /*
        Sized in CSS, not in width/height attributes. Slint reads this element's
        `client_width`/`client_height` to derive the window's preferred size (see
        `i-slint-backend-winit`'s `winitwindowadapter.rs`, "Try to maintain the existing
        size of the canvas element") and writes the backing-store `width`/`height` itself
        from the physical size. So CSS is what makes the responsive layout actually see
        the viewport; setting the attributes here would fight it.
      */
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <!--
      `id="canvas"` is REQUIRED and is not a convention of this page's own: Slint's winit
      backend looks up exactly `document.getElementById("canvas")` and binds its renderer
      to that element (`winitwindowadapter.rs`, the `.with_canvas(Some(html_canvas))`
      branch). Without it that lookup returns `None`, winit falls back to creating a
      canvas of its own -- and its web backend does NOT attach that one to the document,
      so the app runs, paints into an element that is not in the DOM, and the page shows
      nothing but this stylesheet's background color. That was the symptom: a dark page,
      no canvas in the DOM, and no error beyond winit's own "Using exceptions for control
      flow" notice (which is expected on every Slint web app -- see README).
    -->
    <canvas id="canvas"></canvas>
    <!--
      Profiles. `data-cargo-profile-dev="indicatrix-web-compute"`: the page uses the SAME
      optimised dev profile as the Worker below (no debug info), not plain `dev`. The Solid
      and Diagram views rasterise on the main thread and the solver runs there for small
      designs, and unoptimised wasm made a solid frame take about 1.8 s and stalled the page.
      One profile for both crates also means the shared dependencies (the meet solver, the
      rasteriser, `glam`) compile once, not once per profile; the workspace `Cargo.toml` drops
      only the page crate itself to opt-level 1 there, to keep dev rebuilds short.
      `data-cargo-profile-release="indicatrix-web-release"` is the same idea for
      `trunk build --release` (see the workspace `Cargo.toml`); it is on both `<link>`s.

      wasm-opt (release builds only): level `s` on the page, `3` on the Worker, with the wasm
      features rustc emits enabled explicitly (bulk memory, non-trapping float-to-int, sign
      extension, mutable globals, reference types, multivalue). If a release build ever fails
      inside wasm-opt, set `data-wasm-opt="0"` on the failing `<link>` to ship rustc's output
      as it is, and report the message.
    -->
    <link
      data-trunk
      rel="rust"
      data-wasm-opt="s"
      data-wasm-opt-params="--enable-bulk-memory --enable-nontrapping-float-to-int --enable-sign-ext --enable-mutable-globals --enable-reference-types --enable-multivalue"
      data-cargo-profile-dev="indicatrix-web-compute"
      data-cargo-profile-release="indicatrix-web-release"
    />
    <!--
      The Web Worker (render and solve workers both run this one script). Trunk builds
      `apps/indicatrix-web-compute` with wasm-bindgen's `no-modules` target, adds no
      script tag for it, and writes three files to `dist/` named after the package,
      never content-hashed: `indicatrix-web-compute.js`, `indicatrix-web-compute_bg.wasm`
      and, from `data-loader-shim`, `indicatrix-web-compute_loader.js`, which imports the
      first and instantiates the second. The page starts workers from that loader --
      `indicatrix_web_core::WORKER_LOADER_URL` must match its name. Trunk builds it once
      and every Worker (render, solve, analysis) loads the same file; the browser fetches the
      `.wasm` once and serves it from its cache to the rest.

      `data-cargo-profile-dev="indicatrix-web-compute"`: a dev build (`trunk serve`, `trunk build`)
      compiles the worker with the workspace's `[profile.indicatrix-web-compute]` (opt-level 3,
      no debug info), because debug wasm traces far too slowly to render with. Trunk 0.21
      passes it as `cargo build --profile indicatrix-web-compute`. A `--release` build uses
      `[profile.indicatrix-web-release]` instead, and wasm-opt level `3`: the Worker is the
      compute-bound module, so speed wins over the last few percent of size.
    -->
    <link
      data-trunk
      rel="rust"
      href="../indicatrix-web-compute/Cargo.toml"
      data-type="worker"
      data-loader-shim
      data-wasm-opt="3"
      data-wasm-opt-params="--enable-bulk-memory --enable-nontrapping-float-to-int --enable-sign-ext --enable-mutable-globals --enable-reference-types --enable-multivalue"
      data-cargo-profile-dev="indicatrix-web-compute"
      data-cargo-profile-release="indicatrix-web-release"
    />
  </body>
</html>
